[package]
name = "karst-crypto"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

# The cryptographic primitives, and NOTHING above them (#143 / #247). This crate cannot name a
# request type, a transport, or a relay — it is the bottom of the dependency arrow, so a change to
# the protocol cannot reach in here and a bug here cannot be blamed on the wire.
#
# The group is closed by construction: `ratchet` uses `seal` + `session`, `pqxdh` uses `blind` +
# `seal`, and nothing else reaches outside. That is why it is the cleanest of the remaining cuts.
[dependencies]
x25519-dalek = { version = "2", features = ["static_secrets"] }
xeddsa = "1.1"
rand010 = { package = "rand", version = "0.10" }
curve25519-dalek = { version = "4.1.3", features = ["digest"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
snow = "0.10.0"
ml-kem = { version = "0.3", features = ["getrandom"] }
