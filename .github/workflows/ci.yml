name: CI

# Mandatory gates on every push and PR to main (hardening issue #1). The Rust
# workspace lives under impl/, so every job runs there.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build / clippy / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: impl
    steps:
      - uses: actions/checkout@v4
      # The install scripts are the first thing a new user runs, and a shell script that does not
      # PARSE fails at that first contact rather than in a test. `install-node.sh` shipped for a
      # while with one stray quote that made the whole file unrunnable, and nothing caught it —
      # `bash -n` costs a second and would have.
      - name: shell scripts parse
        working-directory: .
        run: for f in scripts/*.sh; do bash -n "$f" || exit 1; done
      # System libraries the `desktop` (Tauri) crate links against.
      - name: install desktop (Tauri) system deps
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: impl
      # Warnings are errors: the tree is kept clippy-clean, so a new warning fails CI.
      - name: clippy (default features)
        run: cargo clippy --all-targets -- -D warnings
      # The unaudited-crypto feature is a real build variant (tring); gate it too.
      - name: clippy (unaudited-crypto)
        run: cargo clippy --all-targets --features unaudited-crypto -- -D warnings
      # KARST_INSECURE_FAST_KDF drops Argon2id to its minimum cost for the test runs ONLY.
      # The production profile is 128 MiB / t=3 (CRYPTO-34) and the suite derives keys ~150
      # times in tests that are not about the KDF — at full cost that is minutes of CI per
      # run, which is how a conservative profile ends up quietly lowered later. The hatch is
      # behind `cfg(debug_assertions)`, so the release job below cannot be affected by it,
      # and one test still exercises the real profile end to end.
      # The install and demo scripts ARE the first five minutes of the project, and they broke
      # silently: the relay binary moved crates and every script that built it kept naming the old
      # one; a stray quote made the relay installer unparseable; the admission model changed and
      # the demo kept asking for a credential the relay no longer honours. None of it failed a
      # test, because no test ran them. This does: the demo brings up a relay, earns admission,
      # exchanges messages in both directions and round-trips a file, and fails CI if any step
      # stops working. A documented command nobody executes is a documented command that rots.
      # The production gate (#145) must REFUSE to build, and must refuse for the stated reason.
      # An inverted check on purpose: if someone deletes the gate to make a build succeed, this
      # step goes green-to-red, which is the only way a guard whose job is to fail stays honest.
      - name: production build is refused
        run: |
          if cargo check -p relay --features production 2>err.txt; then
            echo "FAIL: --features production compiled. The gate is gone or bypassed." >&2
            exit 1
          fi
          grep -q "no production build yet" err.txt || {
            echo "FAIL: it failed, but not through the gate. Real error:" >&2; cat err.txt >&2; exit 1; }
          # ...and it must OPEN once the missing piece is declared, or it is a wall, not a gate.
          cargo check -p relay --features production,audited-token-verifier
      - name: end-to-end demo scripts
        working-directory: .
        run: |
          ./scripts/karst-demo.sh 127.0.0.1:9401
          ./scripts/karst-wss-demo.sh 127.0.0.1:9402
      - name: test (default)
        run: cargo test
        env:
          KARST_INSECURE_FAST_KDF: "1"
      # `unaudited-crypto` is defined and #[cfg]-gated ONLY in the admission crate (tring
      # + token + lib); no other crate reads or enables it. Running the WHOLE workspace
      # under the feature re-ran the slow gui/node integration suites for zero added
      # coverage — scope it to the one crate the feature actually changes.
      - name: test (unaudited-crypto, admission only)
        run: cargo test -p admission --features unaudited-crypto

  # Release build in its own job so it runs concurrently with the tests instead of
  # tailing them on the critical path (same gate, shorter wall clock).
  release:
    name: release build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: impl
    steps:
      - uses: actions/checkout@v4
      # System libraries the `desktop` (Tauri) crate links against.
      - name: install desktop (Tauri) system deps
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: impl
      - name: build release
        run: cargo build --release

  audit:
    name: dependency security audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: impl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      # Prebuilt binary — no compile on the runner.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Fail on any RustSec advisory affecting the locked dependency graph. NO IGNORES.
      #
      # RUSTSEC-2026-0194 / -0195 (quick-xml DoS) used to be ignored here with a
      # justification that has since expired twice over: the eframe/winit path that pulled
      # quick-xml in (via wayland-scanner) left with the egui GUI crate, and the copy that
      # remains — a Tauri build dependency, through plist — is 0.41.0, which is the PATCHED
      # version both advisories name. A justified ignore is fine; a stale one is a place a
      # real advisory can hide, so it is gone rather than re-explained.
      - name: cargo audit
        run: cargo audit
