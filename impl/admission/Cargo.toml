[package]
name = "admission"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
subtle = "2"
curve25519-dalek = { version = "4", features = ["serde"] }
thiserror = "1"

[features]
