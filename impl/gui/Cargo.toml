[package]
name = "gui"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
node = { path = "../node" }
client = { path = "../client" }
hex = "0.4"
# egui/eframe — чистый Rust, MIT/Apache (под ценности проекта); glow-бэкенд.
# wayland/xkb грузятся через dlopen в рантайме, не при линковке.
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
# image: PNG codec ONLY (one codec = minimal attack surface for decoding untrusted
# avatar bytes). Already in the tree via eframe, so this adds ~no new deps. Used for
# the avatar pipeline: bounded decode (Limits) + resize + re-encode, in gui only —
# client stays image-agnostic (opaque bytes).
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
# Integration tests build PNGs to exercise the avatar path end-to-end.
image = { version = "0.25", default-features = false, features = ["png"] }

[lib]
name = "gui"
path = "src/lib.rs"

[[bin]]
name = "karst-gui"
path = "src/main.rs"
