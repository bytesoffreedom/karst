[package]
name = "client"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
admission = { path = "../admission" }
node = { path = "../node" }
# The deniable container's storage layer. `vault` depends only on `karst-crypto`, so this edge
# runs the right way: the format sits BELOW the protocol, not beside it.
vault = { path = "../vault" }
x25519-dalek = { version = "2", features = ["static_secrets"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
hex = "0.4"
# At rest: Argon2id (a password KDF) plus XChaCha20-Poly1305 (a 24-byte nonce, so a
# fresh random one per write is safe without a counter). Both RustCrypto, Apache/MIT.
argon2 = "0.5"
chacha20poly1305 = "0.10"
sha2 = "0.10"
bip39 = { version = "2.2.2", default-features = false, features = ["std"] }
hkdf = "0.12"
rand = "0.8"
# CRYPTO-09: explicit zeroization of key material on drop. Already in the graph transitively
# (dalek, chacha20poly1305), taken as a DIRECT dependency so our own types can opt in rather than
# relying on whatever a transitive user happens to enable.
zeroize = { version = "1", features = ["derive"] }
qrcode = { version = "0.14.1", default-features = false }
karst-transport = { version = "0.1.0", path = "../transport" }
karst-client-core = { version = "0.1.0", path = "../client-core" }

# Unix-only C calls, two of them: `flock(2)` for the deniable container's single-writer lock
# (A3-8 — std has no advisory file locking, and a lock FILE is not an option because a hidden
# account's directory must hold `container.dat` and nothing else), and `tcsetattr` to turn
# terminal echo off for the CLI passphrase prompt (CRYPTO-09). Already in the dependency graph
# via getrandom, so this adds no new supply-chain surface.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "karst"
path = "src/bin/karst.rs"

[dev-dependencies]
# The client's integration tests drive a LIVE relay. A dev-dependency only: the library itself
# does not, and must not, depend on the relay crate (#143).
relay = { path = "../relay" }
# Build capabilities with relay-specific ids/secrets in the tests (CRYPTO-24), instead of the
# single globally-known dev credential every dev relay accepts.
admission = { path = "../admission" }

[features]
# Failure injection for crash-consistency tests (QA-2). Off by default; forwards to `node`, where
# the mechanism and its guards live. With it off, every `fail_point!` expands to nothing.
failpoints = ["node/failpoints"]
