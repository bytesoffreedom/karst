[package]
name = "relay"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

# The UNTRUSTED half (#143). Everything here runs on a machine the user does not control and must
# never be reachable from a client: the mailbox store, the bundle/OPK store, the admission
# enforcement, the node-list gossip and the TCP/WSS listener. It depends on `node` for the shared
# protocol vocabulary and the crypto primitives — never the other way round, which is the whole
# point of the split. A relay operator's binary links the client's key handling only because both
# sides need the same primitives, and the direction of the dependency is what says which is which.
[dependencies]
node = { path = "../node" }
admission = { path = "../admission" }
x25519-dalek = { version = "2", features = ["static_secrets"] }
curve25519-dalek = { version = "4.1.3", features = ["digest"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
rand = "0.8"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
snow = "0.10.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
tungstenite = "0.24"

[[bin]]
name = "karst-relay"
path = "src/bin/relay.rs"

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
postcard = { version = "1", features = ["use-std"] }
