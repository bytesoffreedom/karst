[package]
name = "client"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
admission = { path = "../admission" }
node = { path = "../node" }
x25519-dalek = { version = "2", features = ["static_secrets"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
hex = "0.4"
# At-rest: Argon2id (парольный KDF) + XChaCha20-Poly1305 (24-байтный nonce →
# свежий random на запись безопасен без счётчика). Оба RustCrypto, Apache/MIT.
argon2 = "0.5"
chacha20poly1305 = "0.10"
sha2 = "0.10"
bip39 = { version = "2.2.2", default-features = false, features = ["std"] }
hkdf = "0.12"
rand = "0.8"
qrcode = { version = "0.14.1", default-features = false }

# `flock(2)` for the deniable container's single-writer lock (A3-8). Unix only, and only for that
# one call — std has no advisory file locking, and a lock FILE is not an option here: a hidden
# account's directory must hold `container.dat` and nothing else (a second file is a tell). Already
# in the dependency graph via getrandom, so this adds no new supply-chain surface.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "karst"
path = "src/bin/karst.rs"

[dev-dependencies]
